{% extends "template.html" %}

{% load static %}

{% block titulo %}Senha redefinida{% endblock %}

{% block estilos %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block conteudo %}
<section class="auth-card">
    <div class="auth-heading">
        <p class="auth-kicker">Recuperação concluída</p>
        <h2>Senha atualizada</h2>
        <p>Sua senha foi redefinida. Você já pode entrar com a nova senha.</p>
    </div>
    <a class="auth-button" href="{% url 'login' %}">Ir para o login</a>
</section>
{% endblock %}
